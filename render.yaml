# Render Blueprint: https://render.com/docs/blueprint-spec
databases:
  - name: chakataqa-db
    plan: free
    region: frankfurt
    databaseName: chakataqa
    user: chakataqa
    ipAllowList: [] # only the web service can connect

services:
  - type: web
    name: chakataqa
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: ./build.sh
    startCommand: python -m gunicorn config.wsgi:application
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: chakataqa-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "0"
      - key: WEB_CONCURRENCY
        value: "2"
      - key: PAYSTACK_CURRENCY
        value: KES
      # sync: false = Render asks you for these values when you create the Blueprint.
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: PAYSTACK_PUBLIC_KEY
        sync: false
      - key: DJANGO_SUPERUSER_USERNAME
        sync: false
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
