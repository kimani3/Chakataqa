{% extends "investors/base_portal.html" %}

{% block portal_title %}Change password{% endblock %}

{% block portal_content %}
<div class="narrow">
  <form class="card stack" method="post">
    {% csrf_token %}
    <h1 class="h2">Change password</h1>
    {% for field in form %}{% include "investors/_field.html" %}{% endfor %}
    <button class="btn btn-primary btn-block" type="submit">Update password</button>
  </form>
</div>
{% endblock %}
